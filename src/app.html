<!doctype html>
<html lang="%sveltekit.lang%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f43f5e" id="meta-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <script>
      // Apply the saved design/theme class to <body> before first paint so the
      // page renders in the user's real theme immediately — no light→dark flash,
      // no unstyled flash. Mirrors the reactive block in src/routes/+layout.svelte.
      try {
        var raw = localStorage.getItem('pulse_settings');
        var t = (raw && JSON.parse(raw).theme) || 'vercel-light';
        var design = t === 'resend' ? 'resend' : t.split('-')[0];
        var dark = t === 'resend' || /-dark$/.test(t);
        document.body.className = 'design-' + design + (dark ? ' theme-dark' : '');
      } catch (e) {}
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
